[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cpipe"
version = "2.0.0"
description = "V2-only local development with frozen approval, observed tests and independent review."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Christian Rey Villablanca"},
]
keywords = ["hermes-agent", "development-workflow", "ai-agents", "planning", "testing", "code-review", "pull-requests", "workflow-automation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/chryzxc/cpipe"
Issues = "https://github.com/chryzxc/cpipe/issues"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.sdist]
only-include = [
  "cpipe", "tests", ".github", ".gitignore", "__init__.py",
  "README.md", "LICENSE", "plugin.yaml", "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["cpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"  # hermes hashes this whole dir; a .pytest_cache write makes it rebuild
pythonpath = [".", "tests"]
markers = ["e2e: drives the real hermes CLI on a temp board (pytest -m e2e)"]
