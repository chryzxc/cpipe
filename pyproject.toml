[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cpipe"
version = "0.4.0"
description = "cpipe: an AI dev team pipeline for Hermes Agent: your profiles plan, build, review, and verify."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Christian Rey Villablanca"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
]
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["cpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"  # hermes hashes this whole dir; a .pytest_cache write makes it rebuild
pythonpath = ["."]
markers = ["e2e: drives the real hermes CLI on a temp board (pytest -m e2e)"]
