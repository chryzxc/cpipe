[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cpipe"
version = "0.8.3"
description = "Session-aware collaborative development for Hermes Agent with independent review, revision-bound verification, bounded code-graph context and repository-scoped outcome learning. Adopt committed work or start explicitly; prepare draft pull requests, never merge or deploy."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Christian Rey Villablanca"},
]
keywords = ["hermes-agent", "kanban", "delivery", "planning", "tdd", "code-review", "agentic-workflow", "graph-engineering", "loop-engineering", "profiled-agents", "opt-in-workflow", "outcome-learning", "code-graph", "session-aware"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6", "agent-client-protocol>=0.9,<0.10"]

[project.urls]
Homepage = "https://github.com/chryzxc/cpipe"
Issues = "https://github.com/chryzxc/cpipe/issues"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.sdist]
only-include = [
  "cpipe", "tests", ".github", ".gitignore", "__init__.py",
  "README.md", "LICENSE", "plugin.yaml", "pyproject.toml",
  "docs/runtime/README.md", "docs/runtime/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["cpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"  # hermes hashes this whole dir; a .pytest_cache write makes it rebuild
pythonpath = [".", "tests"]
markers = ["e2e: drives the real hermes CLI on a temp board (pytest -m e2e)"]
