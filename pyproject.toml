[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cpipe"
version = "0.5.0"
description = "cpipe: a Hermes plugin that turns a request in Hermes chat into a deliverable: a tested, QA'd, reviewed PR ready to merge."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Christian Rey Villablanca"},
]
keywords = ["hermes-agent", "codex", "claude-code", "kanban", "delivery", "code-review", "agentic-workflow", "graph-engineering", "loop-engineering"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6", "agent-client-protocol>=0.9,<0.10"]

[project.urls]
Homepage = "https://github.com/chryzxc/cpipe"
Issues = "https://github.com/chryzxc/cpipe/issues"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["cpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"  # hermes hashes this whole dir; a .pytest_cache write makes it rebuild
pythonpath = [".", "tests"]
markers = ["e2e: drives the real hermes CLI on a temp board (pytest -m e2e)"]
