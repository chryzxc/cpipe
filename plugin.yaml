description: "cpipe: a dev plugin that turns a request in Hermes chat into a deliverable: a tested, QA'd, reviewed PR ready to merge. One card per delivery, one engine session (Codex, Claude Code, a Hermes bot or opencode), graph engineering (a fixed graph in code) and loop engineering (bounded loops back into the same session)."
