name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 1744a19e0df568c647e4f3ff9c37f2a284a282fb
          path: .hermes-agent
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project .hermes-agent --group dev
      - name: Install plugin dependencies into the Hermes test runtime
        run: uv pip install --python .hermes-agent/.venv/bin/python -e .
      - name: Test standalone v2 plugin against the supported Hermes host
        env:
          HERMES_AGENT_ROOT: ${{ github.workspace }}/.hermes-agent
        run: .hermes-agent/.venv/bin/python -m pytest tests -ra
