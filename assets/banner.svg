  <text x="60" y="266" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#6e7681">risk-tiered ceremony · frozen-SHA review gates · evidence-based PRs · self-healing kanban</text>
