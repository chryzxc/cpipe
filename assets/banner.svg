    <text x="330" y="206" fill="#484f58">→</text>
    <rect x="352" y="178" width="100" height="44" rx="22" fill="#1f6feb" opacity="0.25"/>
    <text x="402" y="206" fill="#79c0ff" text-anchor="middle">plan</text>
    <text x="464" y="206" fill="#484f58">→</text>
    <rect x="486" y="178" width="190" height="44" rx="22" fill="#238636" opacity="0.3"/>
    <text x="581" y="206" fill="#7ee787" text-anchor="middle">parallel TDD</text>
    <text x="688" y="206" fill="#484f58">→</text>
    <rect x="710" y="178" width="126" height="44" rx="22" fill="#8957e5" opacity="0.3"/>
